<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
      }
      .metric-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      .metric-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #e2e8f0;
      }
      
      /* Dynamic Ambient Elements */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-16px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes beamFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .glow-orb-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .glow-orb-2 {
        animation: pulseGlow 10s ease-in-out infinite alternate;
        transform-origin: 1000px 300px;
      }
      .flow-line {
        stroke-dasharray: 12, 12;
        animation: beamFlow 14s linear infinite;
      }
      .radar-arm {
        transform-origin: 1050px 115px;
        animation: radarSweep 10s linear infinite;
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#techGrid)" />

  <!-- Animated Ambient Orbs in Background -->
  <circle cx="180" cy="90" r="220" fill="url(#glowGrad1)" class="glow-orb-1" />
  <circle cx="1020" cy="320" r="260" fill="url(#glowGrad2)" class="glow-orb-2" />

  <!-- Dynamic Network Connection Vectors (Behind Foreground Cards & Text) -->
  <path d="M 120 340 C 350 280, 480 380, 720 320 S 980 340, 1120 280" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" class="flow-line" />
  <path d="M 80 180 C 260 220, 520 120, 800 200 S 1040 140, 1150 180" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.3" class="flow-line" style="animation-direction: reverse; animation-duration: 18s;" />

  <!-- Radar / Indexing Graphic Accent (Top-Right Background) -->
  <g opacity="0.45">
    <circle cx="1050" cy="115" r="55" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="1050" cy="115" r="36" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="1050" cy="115" r="18" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <line x1="1050" y1="115" x2="1105" y2="115" stroke="#38bdf8" stroke-width="2" class="radar-arm" stroke-linecap="round" />
  </g>

  <!-- Dynamic Ambient Floating Data Nodes -->
  <circle cx="240" cy="310" r="3" fill="#38bdf8" class="particle-1" />
  <circle cx="680" cy="110" r="2.5" fill="#818cf8" class="particle-2" />
  <circle cx="940" cy="270" r="3.5" fill="#c084fc" class="particle-3" />
  <circle cx="480" cy="350" r="2.5" fill="#38bdf8" class="particle-2" />

  <!-- ================= FOREGROUND (High contrast, clearly visible) ================= -->
  
  <!-- Pill Badge: Category Tag -->
  <g transform="translate(80, 50)">
    <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="32" y="20" class="badge-text">UNIFIED EMAIL &amp; COMMUNICATION INBOX</text>
  </g>

  <!-- Main Banner Title with Gradient -->
  <text x="80" y="136" class="title-text" fill="url(#accentGrad)">Awesome Unified Communication Inbox</text>

  <!-- Clear Subtitle -->
  <text x="80" y="176" class="subtitle-text">Curated directory of shared inboxes, omnichannel customer messaging &amp; open-source email platforms</text>

  <!-- Foreground Feature Highlights (3 Metric Cards) -->
  <g transform="translate(80, 220)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="320" height="88" rx="12" fill="#0b132b" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.4" />
      <text x="24" y="34" class="metric-label">Collaboration Architecture</text>
      <text x="24" y="64" class="metric-val">Shared Inboxes &amp; Live Collision</text>
      <circle cx="290" cy="44" r="8" fill="#38bdf8" fill-opacity="0.2" />
      <circle cx="290" cy="44" r="4" fill="#38bdf8" />
    </g>

    <!-- Card 2 -->
    <g transform="translate(350, 0)">
      <rect width="320" height="88" rx="12" fill="#0b132b" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.4" />
      <text x="24" y="34" class="metric-label">Channel Coverage</text>
      <text x="24" y="64" class="metric-val">Email, Chat, SMS &amp; Social DMs</text>
      <circle cx="290" cy="44" r="8" fill="#818cf8" fill-opacity="0.2" />
      <circle cx="290" cy="44" r="4" fill="#818cf8" />
    </g>

    <!-- Card 3 -->
    <g transform="translate(700, 0)">
      <rect width="340" height="88" rx="12" fill="#0b132b" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.4" />
      <text x="24" y="34" class="metric-label">Self-Hosted Ecosystem</text>
      <text x="24" y="64" class="metric-val">10+ Open-Source Alternatives</text>
      <circle cx="310" cy="44" r="8" fill="#c084fc" fill-opacity="0.2" />
      <circle cx="310" cy="44" r="4" fill="#c084fc" />
    </g>
  </g>

  <!-- Bottom Coverage Highlights -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="600">COVERING:</text>
    <text x="75" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">Front • Superhuman • Help Scout • Spark • Hiver • Missive • Chatwoot • Mailspring • Thunderbird • Zammad</text>
  </g>
</svg>